<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Hub — Afya Unigranrio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* HEADER */
        header { background: #3b071e; color: #fff; padding: 15px 20px; border-bottom: 3px solid #be185d; }
        .header-content { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .logo svg { height: 35px; cursor: pointer; }
        .nav-tabs { display: flex; gap: 5px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 50px; }
        .nav-tabs button { background: transparent; color: #fecdd3; border: none; padding: 8px 15px; border-radius: 50px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .nav-tabs button.active { background: #fff; color: #3b071e; }
        .badge { background: #be185d; color: #fff; padding: 2px 7px; border-radius: 20px; font-size: 11px; }

        /* MAIN CONTENT */
        main { max-width: 900px; margin: 30px auto; padding: 0 20px; flex: 1; width: 100%; }
        .title-block { text-align: center; margin-bottom: 25px; }
        .title-block h1 { font-size: 24px; font-weight: 800; color: #0f172a; }
        .title-block p { font-size: 14px; color: #64748b; margin-top: 5px; }
        
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        
        /* FORM */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        @media (max-width: 650px) { .form-grid, .form-grid-3 { grid-template-columns: 1fr; } }
        
        .field { display: flex; flex-direction: column; gap: 5px; }
        .field label { font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; }
        .field input, .field select, .field textarea { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        .field input:focus, .field select:focus, .field textarea:focus { border-color: #be185d; box-shadow: 0 0 0 2px rgba(190,24,93,0.2); }
        
        .btn-submit { width: 100%; background: #be185d; color: #fff; border: none; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        .btn-submit:hover { background: #9d174d; }
        
        /* PANELS */
        .hidden { display: none !important; }
        .item-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .item-header { display: flex; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 10px; }
        .item-title { font-weight: 700; font-size: 16px; color: #0f172a; }
        .item-id { font-size: 11px; color: #94a3b8; font-family: monospace; }
        .status-badge { background: #fce7f3; color: #9d174d; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .item-body p { font-size: 13px; color: #475569; margin-bottom: 5px; }
        
        /* FOOTER & MISC */
        footer { background: #fff; border-top: 1px solid #e2e8f0; padding: 15px 20px; font-size: 12px; color: #64748b; margin-top: auto; }
        .footer-content { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #0f172a; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transition: 0.3s; pointer-events: none; z-index:9999; }
        .toast.show { opacity: 1; transform: translateY(-10px); }
        .btn-outlook { background: #0ea5e9; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-outlook:hover { background: #0284c7; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo" onclick="mudarAba('novo')">
                <svg viewBox="0 0 420 80" fill="currentColor">
                    <path d="M 22.5 55 L 42.5 15 L 62.5 55 L 50 55 L 42.5 37.5 L 35 55 Z M 42.5 5 L 77.5 75 L 57.5 75 L 42.5 45 L 27.5 75 L 7.5 75 Z" fill="#ffffff"/>
                    <text x="85" y="58" font-family="'Inter', sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">Afya</text>
                    <text x="210" y="32" font-family="'Inter', sans-serif" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="0.5">UNIVERSIDADE</text>
                    <text x="208" y="60" font-family="'Inter', sans-serif" font-size="33" font-weight="900" fill="#ffffff" letter-spacing="-0.5">UNIGRANRIO</text>
                </svg>
            </div>
            <div class="nav-tabs">
                <button id="btn-novo" class="active" onclick="mudarAba('novo')">Novo Pedido</button>
                <button id="btn-painel" onclick="mudarAba('painel')">Painel <span id="cnt-painel" class="badge">0</span></button>
                <button id="btn-meus" onclick="mudarAba('meus')">Meus Pedidos <span id="cnt-meus" class="badge">0</span></button>
                <button id="btn-emails" onclick="mudarAba('emails')">Emails Enviados <span id="cnt-emails" class="badge">0</span></button>
            </div>
        </div>
    </header>

    <main>
        <section id="aba-novo">
            <div class="title-block">
                <h1>Novo Pedido de Marketing</h1>
                <p>Abra um chamado diretamente com a equipa de atendimento.</p>
            </div>
            <div class="card">
                <form id="formPedido" onsubmit="enviarPedido(event)">
                    <div class="form-grid" style="background:#fff1f2; padding:15px; border-radius:8px; margin-bottom:15px; border:1px solid #fecdd3;">
                        <div class="field">
                            <label style="color:#9f1239;">Nome do Solicitante *</label>
                            <input type="text" id="reqNome" required placeholder="Ex.: João Silva">
                        </div>
                        <div class="field">
                            <label style="color:#9f1239;">E-mail do Solicitante *</label>
                            <input type="email" id="reqEmail" required placeholder="exemplo@afya.com.br">
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="field">
                            <label>Título da Demanda *</label>
                            <input type="text" id="titulo" required placeholder="Ex.: Campanha site">
                        </div>
                        <div class="field">
                            <label>Unidade / Setor *</label>
                            <select id="unidade" required>
                                <option value="Duque de Caxias">Duque de Caxias</option>
                                <option value="Barra da Tijuca">Barra da Tijuca</option>
                                <option value="Nova Iguaçu">Nova Iguaçu</option>
                                <option value="Propep">Propep</option>
                                <option value="Reitoria">Reitoria</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-grid-3">
                        <div class="field">
                            <label>Área *</label>
                            <select id="area" required>
                                <option value="Design">Design</option>
                                <option value="Redes Sociais">Redes Sociais</option>
                                <option value="Disparos">Disparos</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>Tipo de Serviço *</label>
                            <select id="tipoPeca" required>
                                <option value="Alteração no site">Alteração no site</option>
                                <option value="Banner">Banner</option>
                                <option value="Story">Story</option>
                                <option value="Outros">Outros</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>Prazo (Mín 3 dias) *</label>
                            <input type="date" id="prazo" required>
                        </div>
                    </div>

                    <div class="field">
                        <label>Briefing / Detalhes *</label>
                        <textarea id="briefing" rows="4" required placeholder="Escreva aqui todas as instruções..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit" id="btnSubmit">Submeter Pedido</button>
                </form>
            </div>
        </section>

        <section id="aba-painel" class="hidden">
            <div class="title-block"><h1>Painel de Gestão</h1></div>
            <div id="lista-painel"></div>
        </section>

        <section id="aba-meus" class="hidden">
            <div class="title-block"><h1>Os Meus Pedidos</h1></div>
            <div id="lista-meus"></div>
        </section>

        <section id="aba-emails" class="hidden">
            <div class="title-block"><h1>Log de E-mails Disparados</h1></div>
            <div id="lista-emails"></div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <span>🚀 GitHub Pages CORS Bypass Ativo</span>
        </div>
    </footer>

    <div id="toast" class="toast">Ação concluída com sucesso!</div>

    <script>
        const WEBHOOK_URL = "https://default60bcece8eb6b494ea607e83fcdcef3.33.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/13/workflows/4fadb152b5aa4b8dba53b47b7a2b5902/triggers/manual/paths/invoke?api-version=1";
        
        // Proxy para contornar o bloqueio CORS do GitHub Pages
        const PROXY_URL = "https://corsproxy.io/?"; 
        const URL_FINAL = PROXY_URL + encodeURIComponent(WEBHOOK_URL);

        const DESTINATARIO = "atendimentomarketing.unigranrio@afya.com.br";

        let bd_pedidos = JSON.parse(localStorage.getItem("afya_reqs_v5") || "[]");
        
        function initDatas() {
            let data = new Date();
            let diasUteis = 0;
            while (diasUteis < 3) {
                data.setDate(data.getDate() + 1);
                if (data.getDay() !== 0 && data.getDay() !== 6) diasUteis++;
            }
            const minDate = data.toISOString().split('T')[0];
            document.getElementById('prazo').min = minDate;
            document.getElementById('prazo').value = minDate;
        }

        function guardarDados() {
            localStorage.setItem("afya_reqs_v5", JSON.stringify(bd_pedidos));
            document.getElementById("cnt-painel").innerText = bd_pedidos.length;
            document.getElementById("cnt-meus").innerText = bd_pedidos.length;
            document.getElementById("cnt-emails").innerText = bd_pedidos.length;
        }

        function mostrarAviso(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 4000);
        }

        function mudarAba(abaDestino) {
            ['novo', 'painel', 'meus', 'emails'].forEach(aba => {
                document.getElementById(`aba-${aba}`).classList.add('hidden');
                document.getElementById(`btn-${aba}`).classList.remove('active');
            });
            document.getElementById(`aba-${abaDestino}`).classList.remove('hidden');
            document.getElementById(`btn-${abaDestino}`).classList.add('active');

            if(abaDestino === 'painel') desenharPainel();
            if(abaDestino === 'meus') desenharMeus();
            if(abaDestino === 'emails') desenharEmails();
        }

        function enviarPorOutlook(idPedido) {
            const p = bd_pedidos.find(x => x.id === idPedido);
            if (!p) return;
            const assunto = encodeURIComponent(`CHAMADO CRIADO COM SUCESSO: ${p.titulo}`);
            const corpo = encodeURIComponent(`CHAMADO CRIADO COM SUCESSO\nInformações sobre o chamado:\n\nTipo de Serviço: ${p.tipoPeca} (${p.area})\nSolicitante: ${p.requerente} (${p.email})\nDepartamento/Setor: ${p.unidade}\nData de Abertura: ${p.dataAbertura}\nPrazo Desejado: ${p.prazo}\n\nAssunto / Título da Demanda:\n${p.titulo}\n\nDetalhes / Briefing:\n${p.briefing}`);
            window.location.href = `mailto:${DESTINATARIO}?subject=${assunto}&body=${corpo}`;
        }

        async function enviarPedido(e) {
            e.preventDefault();
            const btn = document.getElementById("btnSubmit");
            btn.innerText = "A Processar...";
            btn.disabled = true;

            const novoId = "REQ-" + Math.floor(1000 + Math.random() * 9000);
            const dataAtual = new Date().toLocaleString("pt-BR");

            const pedido = {
                id: novoId,
                dataAbertura: dataAtual,
                status: "Novo",
                titulo: document.getElementById("titulo").value,
                unidade: document.getElementById("unidade").value,
                area: document.getElementById("area").value,
                tipoPeca: document.getElementById("tipoPeca").value,
                prazo: document.getElementById("prazo").value,
                briefing: document.getElementById("briefing").value,
                requerente: document.getElementById("reqNome").value,
                email: document.getElementById("reqEmail").value
            };

            bd_pedidos.unshift(pedido);
            guardarDados();

            let falhou = false;

            // Envio via CORS Proxy para o Power Automate
            try {
                const response = await fetch(URL_FINAL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(pedido)
                });
                if (!response.ok) falhou = true;
            } catch (err) {
                falhou = true;
            }

            if (falhou) {
                mostrarAviso("CORS Proxy falhou. A abrir o Outlook como alternativa...");
                setTimeout(() => enviarPorOutlook(pedido.id), 1500);
            } else {
                mostrarAviso("Sucesso! Chamado entregue no Power Automate.");
            }

            document.getElementById("formPedido").reset();
            initDatas();
            btn.innerText = "Submeter Pedido";
            btn.disabled = false;
            mudarAba('emails');
        }

        function desenharPainel() {
            const caixa = document.getElementById("lista-painel");
            caixa.innerHTML = bd_pedidos.length ? bd_pedidos.map(p => `
                <div class="item-card">
                    <div class="item-header">
                        <div>
                            <div class="item-id">${p.id} • ${p.dataAbertura}</div>
                            <div class="item-title">${p.titulo}</div>
                        </div>
                        <div class="status-badge">${p.status}</div>
                    </div>
                    <div class="item-body">
                        <p><b>Solicitante:</b> ${p.requerente} (${p.email})</p>
                        <p><b>Setor:</b> ${p.unidade} | <b>Área:</b> ${p.area}</p>
                    </div>
                </div>
            `).join('') : '<p style="text-align:center; color:#94a3b8;">Nenhum chamado.</p>';
        }

        function desenharMeus() {
            const caixa = document.getElementById("lista-meus");
            caixa.innerHTML = bd_pedidos.length ? bd_pedidos.map(p => `
                <div class="item-card">
                    <div class="item-header">
                        <div>
                            <div class="item-id">${p.id} • ${p.unidade}</div>
                            <div class="item-title">${p.titulo}</div>
                        </div>
                        <div class="status-badge">${p.status}</div>
                    </div>
                    <div class="item-body">
                        <p><b>Prazo:</b> ${p.prazo}</p>
                    </div>
                </div>
            `).join('') : '<p style="text-align:center; color:#94a3b8;">Sem pedidos efetuados.</p>';
        }

        function desenharEmails() {
            const caixa = document.getElementById("lista-emails");
            caixa.innerHTML = bd_pedidos.length ? bd_pedidos.map(p => `
                <div class="item-card">
                    <div class="item-header" style="border:none; padding:0; margin:0;">
                        <div class="item-title" style="font-size:14px;">CHAMADO CRIADO COM SUCESSO: ${p.titulo}</div>
                        <div class="item-id">${p.dataAbertura}</div>
                    </div>
                    <button class="btn-outlook" onclick="enviarPorOutlook('${p.id}')">
                        📧 Reenviar pelo Outlook
                    </button>
                </div>
            `).join('') : '<p style="text-align:center; color:#94a3b8;">Sem e-mails disparados.</p>';
        }

        window.onload = function() {
            initDatas();
            guardarDados();
        };
    </script>
</body>
</html>
